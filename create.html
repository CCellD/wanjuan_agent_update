<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建 Agent</title>
<style>
  :root { --primary:#3b82f6; --bg:#f7f8fa; --card:#ffffff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:var(--text); }
  .container { max-width:1040px; margin:0 auto; padding:24px; }
  .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .back { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:#eef2ff; color:var(--primary); text-decoration:none; font-size:18px; }
  .title { font-size:20px; font-weight:700; }
  .grid { display:grid; grid-template-columns:560px 1fr; gap:24px; min-height:500px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:18px; min-height:500px; }
  .section-title { font-size:14px; color:var(--muted); }
  .icon-name { display:flex; align-items:center; gap:12px; }
  .app-icon { width:40px; height:40px; border-radius:8px; background:#e0e7ff; display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:700; background-size:cover; background-position:center; cursor:pointer; }
  .name-input { flex:1; height:40px; border:1px solid var(--border); border-radius:10px; padding:0 12px; font-size:14px; max-width:100%; box-sizing:border-box; }
  .error { color:#ef4444; font-size:12px; }
  .create-row { display:flex; justify-content:flex-end; }
  .btn { appearance:none; border:none; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; color:#fff; background:var(--primary); cursor:pointer; }
  .label { font-size:14px; color:var(--muted); }
  .textarea { width:100%; max-width:100%; box-sizing:border-box; min-height:180px; border:1px solid var(--border); border-radius:12px; padding:12px; font-size:14px; resize:vertical; }
  .hero { background:var(--card); border:1px solid var(--border); border-radius:14px; display:flex; align-items:center; justify-content:center; min-height:500px; }
  .cube { width:280px; height:280px; background:linear-gradient(135deg,#93c5fd,#dbeafe); border-radius:24px; box-shadow:0 20px 60px rgba(59,130,246,.25); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="index.html" class="back">‹</a>
    <div class="title">创建 Agent</div>
  </div>
  <div class="grid">
    <div class="panel">
      <div class="section-title">图标 & 名称</div>
      <div class="icon-name">
        <div id="iconPreview" class="app-icon">▧</div>
        <input id="iconFile" type="file" accept="image/*" style="display:none">
        <input id="appName" class="name-input" placeholder="未命名" />
      </div>
      <div id="nameError" class="error"></div>
      <div class="create-row">
        <button id="createBtn" class="btn">创建</button>
      </div>
      <div class="section-title">描述</div>
      <textarea class="textarea" placeholder="请输入该智能问答体的用途、能力或期望行为"></textarea>
    </div>
    <div class="hero">
      <div class="cube"></div>
    </div>
  </div>
</div>
<script>
  var iconPreview = document.getElementById('iconPreview');
  var iconFile = document.getElementById('iconFile');
  var appName = document.getElementById('appName');
  var nameError = document.getElementById('nameError');
  var createBtn = document.getElementById('createBtn');

  iconPreview.addEventListener('click', function(){
    iconFile.click();
  });

  iconFile.addEventListener('change', function(){
    var file = this.files && this.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      iconPreview.style.backgroundImage = 'url(' + e.target.result + ')';
      iconPreview.textContent = '';
    };
    reader.readAsDataURL(file);
  });

  function validateName(value){
    var v = value || '';
    var trimmed = v.trim();
    if(trimmed.length === 0) return '名称为必填项，且不可仅为空格';
    if(/\s/.test(v)) return '名称不可包含空格';
    return '';
  }

  createBtn.addEventListener('click', function(){
    var msg = validateName(appName.value);
    if(msg){
      nameError.textContent = msg;
      appName.style.borderColor = '#ef4444';
      appName.focus();
      return;
    }
    nameError.textContent = '';
    appName.style.borderColor = 'var(--border)';
    try { localStorage.setItem('app_name', appName.value.trim()); } catch(e) {}
    window.location.href = 'config.html';
  });
</script>
</body>
</html>
