<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页</title>
<style>
  :root { --primary:#3b82f6; --bg:#f7f8fa; --text:#111827; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:var(--text); }
  .wrap { height:100%; display:flex; align-items:center; justify-content:center; }
  .btn { appearance:none; border:none; padding:14px 24px; border-radius:10px; font-size:16px; font-weight:600; color:#fff; background:var(--primary); cursor:pointer; box-shadow:0 6px 20px rgba(59,130,246,.35); transition:transform .08s ease, box-shadow .2s ease; }
  .btn:active { transform:scale(.98); box-shadow:0 4px 16px rgba(59,130,246,.3); }
</style>
</head>
<body>
<div class="wrap">
  <button id="createBtn" class="btn">新增智能问答体</button>
.</div>
<script>
  document.getElementById('createBtn').addEventListener('click', function(){
    window.location.href = 'create.html';
  });
</script>
</body>
</html>
